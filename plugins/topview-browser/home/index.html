            <svg class="hero-card-art hero-line-art line-art-camera" viewBox="0 0 320 200" preserveAspectRatio="xMaxYMid meet" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><defs><pattern id="la-grid-v" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" stroke-width=".75" /></pattern><radialGradient id="la-fade-v" cx="62%" cy="52%" r="58%"><stop offset="0" stop-color="#fff" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></radialGradient><mask id="la-mask-v"><rect width="320" height="200" fill="url(#la-fade-v)" stroke="none" /></mask></defs><rect class="la-grid" width="320" height="200" fill="url(#la-grid-v)" stroke="none" mask="url(#la-mask-v)" /><g class="la-guide" stroke-dasharray="2 4"><path d="M92 59H272M150 14V100M222 18V96" /><circle cx="150" cy="60" r="42" /></g><g class="la-guide"><path d="M108 12H192M108 8V16M192 8V16" /></g><g class="la-main"><g class="la-reel"><circle cx="150" cy="60" r="34" /><circle cx="150" cy="60" r="28" class="la-soft" /><circle cx="150" cy="60" r="4.5" /><circle cx="169" cy="60" r="6.5" /><circle cx="159.5" cy="76.45" r="6.5" /><circle cx="140.5" cy="76.45" r="6.5" /><circle cx="131" cy="60" r="6.5" /><circle cx="140.5" cy="43.55" r="6.5" /><circle cx="159.5" cy="43.55" r="6.5" /></g><g class="la-reel la-reel-rear"><circle cx="222" cy="58" r="30" /><circle cx="222" cy="58" r="24" class="la-soft" /><circle cx="222" cy="58" r="4" /><circle cx="238" cy="58" r="5.5" /><circle cx="230" cy="71.86" r="5.5" /><circle cx="214" cy="71.86" r="5.5" /><circle cx="206" cy="58" r="5.5" /><circle cx="214" cy="44.14" r="5.5" /><circle cx="230" cy="44.14" r="5.5" /></g><path d="M150 94V102M222 88V102" /><g class="la-loop"><path d="M116 62C110 84 116 97 130 102M252 58C258 80 254 95 240 102" /></g><rect x="124" y="102" width="124" height="58" rx="7" /><rect x="136" y="114" width="36" height="22" rx="3" class="la-soft" /><path d="M136 147H198" class="la-soft" /><circle cx="222" cy="131" r="12" /><circle cx="222" cy="131" r="3" /><path d="M231 139L244 150" /><circle cx="130" cy="108" r="1.2" class="la-soft" /><circle cx="242" cy="108" r="1.2" class="la-soft" /><rect x="104" y="116" width="20" height="30" rx="2" /><path d="M110 116V146M116 116V146" class="la-soft" /><path d="M104 119L80 107V155L104 143" /><path d="M186 160L164 196M186 160L208 196" /><path d="M186 160V196" class="la-soft" /></g><g class="la-film"><path d="M248 143C272 145 286 159 300 184M248 153C268 155 280 167 291 189" class="la-main" /><path class="la-sprocket" d="M248 148C270 150 283 163 295.5 186.5" stroke-dasharray="3 4" /></g><ellipse class="la-accent" cx="80" cy="131" rx="4" ry="24" /></svg>
          </button>
          <button class="hero-card hero-image" data-quick-type="image">
            <span class="hero-card-copy">
              <svg class="hero-card-icon" width="28" height="28" aria-hidden="true"><use href="#hero-image" /></svg>
              <span class="hero-card-title"><span class="hero-card-label" data-i18n="hero.image.title">Image Creation</span></span>
              <span class="hero-card-subtitle" data-i18n="hero.image.subtitle">Create and edit visuals for any need</span>
            </span>
            <!-- Line drawing: a pen over stacked sheets; on hover the pen draws the sketch stroke by stroke. -->
            <svg class="hero-card-art hero-line-art line-art-pen" viewBox="0 0 320 200" preserveAspectRatio="xMaxYMid meet" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><defs><pattern id="la-grid-i" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" stroke-width=".75" /></pattern><radialGradient id="la-fade-i" cx="62%" cy="52%" r="58%"><stop offset="0" stop-color="#fff" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></radialGradient><mask id="la-mask-i"><rect width="320" height="200" fill="url(#la-fade-i)" stroke="none" /></mask></defs><rect class="la-grid" width="320" height="200" fill="url(#la-grid-i)" stroke="none" mask="url(#la-mask-i)" /><g class="la-sheets"><rect x="136" y="34" width="140" height="122" rx="6" transform="rotate(7 206 95)" stroke-dasharray="4 5" class="la-soft" /><rect x="120" y="40" width="140" height="122" rx="6" transform="rotate(-3 190 101)" class="la-soft" /></g><rect class="la-sheet la-main" x="104" y="48" width="140" height="122" rx="6" /><rect x="116" y="60" width="116" height="98" rx="3" stroke-dasharray="2 4" class="la-guide" /><path d="M110 54H120M110 54V64M238 54H228M238 54V64M110 164H120M110 164V154M238 164H228M238 164V154" class="la-guide" /><circle cx="210" cy="84" r="9" class="la-soft" /><path class="la-ruler la-guide" d="M104 184H244" stroke-width="6" stroke-dasharray=".8 9.2" stroke-linecap="butt" /><path d="M104 188H244" class="la-guide" /><path class="la-accent la-draw" d="M120 146L150 110L168 128L192 98L228 146" pathLength="1" /><g class="la-pen la-main"><g transform="rotate(-50)"><path d="M0 0L16 -5V5Z" /><path d="M4 0H12" class="la-soft" /><rect x="16" y="-5" width="14" height="10" rx="1.5" /><rect x="30" y="-6" width="64" height="12" rx="3" /><path d="M42 -6V-9H82" /><path d="M94 -6Q101 0 94 6" /></g></g></svg>
          </button>
          <button class="hero-card hero-motion motion-entry" id="motion-open" aria-haspopup="dialog">
            <!-- Kinetic type: staggered MOTION wordmark on a keyframe track over dimmed real Motion templates. -->
            <span class="hero-card-art motion-type-art" aria-hidden="true"><span class="motion-type-bg"></span><span class="motion-type"><span class="mt-l">M</span><span class="mt-l">O</span><span class="mt-l">T</span><span class="mt-l">I</span><span class="mt-l">O</span><span class="mt-l">N</span></span></span>
            <span class="hero-card-copy">
              <svg class="hero-card-icon" width="28" height="28" aria-hidden="true"><use href="#hero-motion" /></svg>
              <span class="hero-card-title"><span class="hero-card-label">Motion Studio</span></span>
              <span class="hero-card-subtitle" data-i18n="hero.motion.subtitle">Pick a proven style, make it your own</span>
            </span>
            <span class="hero-card-cta" aria-hidden="true" data-i18n="hero.motion.cta">Pick a style<svg width="14" height="14"><use href="#arrow" /></svg></span>
          </button>
        </div>
        <div class="section-top">
          <span class="section-title" id="section-label"
             data-i18n="home.inspirationLabel">A little inspiration to get started</span
          >
          <div class="section-tabs">
            <button class="active" id="inspiration-tab" data-i18n="home.startTab">Start creating</button
            ><button id="recent-tab" data-i18n="home.projectsTab">My Projects</button>
          </div>
        </div>
        <div class="examples" id="examples"></div>
      </section>
      <section class="workbench" id="workbench" aria-label="Creation conversation" data-i18n-attrs="aria-label:workbench.ariaLabel">
        <div class="work-head">
          <button class="back" id="back" data-i18n="workbench.back">← Back to home</button
          ><span class="work-brand">TOPVIEW</span>
        </div>
        <div class="scene-panel tv-modal" id="scene-panel">
          <div class="panel-head tv-modal-head">
            <div class="tv-modal-heading">
              <h2 id="gallery-title" data-i18n="workbench.galleryTitle">What would you like to create?</h2>
            </div>
            <button class="close tv-modal-close" id="close-gallery" aria-label="Close scene picker" data-i18n-attrs="aria-label:workbench.closeScenePicker">
              <svg width="16" height="16"><use href="#close" /></svg>
            </button>
          </div>
          <div class="library-tools" id="library-tools" hidden>
            <label class="skill-search"
              ><svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <circle
                  cx="10.5"
                  cy="10.5"
                  r="6.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <path
                  d="m16 16 5 5"
                  stroke="currentColor"
                  stroke-width="1.5"
                /></svg
              ><input
                id="skill-search"
                type="search"
                aria-label="Search film scenes" data-i18n-attrs="aria-label:workbench.searchFilm"
                placeholder=""
            /></label>
          </div>
          <div class="scene-grid" id="scene-grid"></div>
          <section
            class="quick-explorer"
            id="quick-explorer"
            hidden
            aria-label="Quick start scenes" data-i18n-attrs="aria-label:workbench.quickRegion"
          >
            <div class="quick-type-rail">
              <div class="quick-types" id="quick-types" aria-label="Creation types" data-i18n-attrs="aria-label:workbench.creationTypes" tabindex="-1"></div>
              <button class="quick-rail-button quick-rail-left" type="button" aria-label="Previous creation type" data-i18n-attrs="aria-label:workbench.previousType" aria-controls="quick-types" hidden>
                <svg width="16" height="16" aria-hidden="true"><use href="#arrow" /></svg>
              </button>
              <button class="quick-rail-button quick-rail-right" type="button" aria-label="Next creation type" data-i18n-attrs="aria-label:workbench.nextType" aria-controls="quick-types" hidden>
                <svg width="16" height="16" aria-hidden="true"><use href="#arrow" /></svg>
              </button>
            </div>
            <div class="quick-heading">
              <h3 data-i18n="workbench.exploreIdeas">Explore ideas</h3>
              <button type="button" class="quick-shuffle" id="quick-shuffle" hidden>
                <svg width="15" height="15" aria-hidden="true"><use href="#rotate-cw" /></svg><span data-i18n="workbench.shuffle">Shuffle</span>
              </button>
            </div>
            <div class="quick-ideas" id="quick-ideas"></div>
          </section>
        </div>
        <div
          class="conversation"
          id="conversation"
          role="log"
          aria-live="polite"
        ></div>

        <form class="composer" id="composer" hidden inert>
          <div class="selected-bar" id="selected-bar">
            <svg width="13" height="13"><use href="#spark" /></svg
            ><span id="selected-label"></span
            ><button type="button" id="change-scene" aria-label="Change scene" data-i18n-attrs="aria-label:workbench.changeScene">
              ×
            </button>
          </div>
          <div class="attachments" id="attachments"></div>
          <label class="sr-only" for="prompt" data-i18n="workbench.promptLabel">Tell Topview your idea</label
          ><textarea
            id="prompt"
            placeholder="Describe your idea, or pick a scene above…" data-i18n-attrs="placeholder:workbench.promptPlaceholder"
          ></textarea>
          <div class="composer-bottom">
            <div class="composer-tools">
              <button type="button" id="attach">
                <svg width="17" height="17"><use href="#plus" /></svg
                 data-i18n="workbench.addFiles">Add files</button
              ><button type="button" id="scenes-toggle">
                <svg width="15" height="15"><use href="#spark" /></svg>Scene
              </button>
            </div>
            <button class="send" id="send" aria-label="Send message" data-i18n-attrs="aria-label:workbench.send" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path
                  d="M12 19V5m-6 6 6-6 6 6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </form>
      </section>
    </main>
    <input
      type="file"
      id="file-input"
      multiple
      hidden
      accept="image/*,video/*,audio/*,.pdf,.txt,.md,.docx,.csv,.xlsx"
    />
    <dialog class="motion-dialog tv-modal" id="motion-studio" aria-labelledby="motion-title">
      <header class="motion-heading tv-modal-head">
        <div class="tv-modal-heading">
          <h2 id="motion-title">Motion Studio</h2>
        </div>
        <button type="button" class="motion-close tv-modal-close" aria-label="Close Motion Studio" title="Close Motion Studio" data-i18n-attrs="aria-label:motion.close;title:motion.close">
          <svg width="16" height="16" aria-hidden="true"><use href="#close" /></svg>
        </button>
      </header>
      <div class="motion-tabs" role="tablist" aria-label="Template categories" data-i18n-attrs="aria-label:motion.categories"></div>
      <div class="motion-gallery" id="motion-gallery" role="tabpanel" aria-label="Templates" data-i18n-attrs="aria-label:motion.templates">
        <div class="motion-cards"></div>
        <button class="motion-retry" type="button" data-i18n="motion.reloadTemplates" hidden>Reload templates</button>
      </div>
      <form class="motion-form" novalidate>
        <div class="motion-agents" role="radiogroup" aria-label="Send mode" data-i18n-attrs="aria-label:motion.sendMode">
          <label><input type="radio" name="agent" value="chatgpt" checked /><span data-i18n="composer.addToCodexChat"><img class="codex-mark" src="https://topview-frontend.topviewai.app/plugin/codex-home/openai-white.c63c8da8ee.svg" width="14" height="14" alt="" />Add to Codex chat</span></label>
          <label title="Copy the prompt to paste into another agent" data-i18n-attrs="title:motion.otherAgentHint"><input type="radio" name="agent" value="other" aria-describedby="motion-other-hint" /><span data-i18n="motion.otherAgent"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2" /><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" /></svg>Other Agent</span></label>
          <span class="motion-sr" id="motion-other-hint" data-i18n="motion.otherAgentHint">Copy the prompt to paste into another agent</span>
        </div>
        <!-- Composer mirrors Motion Studio 2.0 (aigc-web-turbo motion-studio-2.0/components/MotionPluginHome.tsx):
             reference tile + clear | media thumbnails, prompt, toolbar | primary action. -->
        <div class="motion-dock">
          <div class="motion-reference" data-empty="true">
            <button class="motion-reference-tile" type="button" aria-label="Pick a style first" data-i18n-attrs="aria-label:motion.pickStyleFirst">
              <img class="motion-thumbnail" alt="" hidden />
              <span class="motion-reference-empty" aria-hidden="true" data-i18n="motion.pickStyleFirst">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M5 12h14M12 5v14" /></svg>
                Pick a style first
              </span>
              <span class="motion-selection" aria-hidden="true" hidden></span>
            </button>
            <button class="motion-clear" type="button" data-i18n="motion.clearReference">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>Clear reference
            </button>
          </div>
          <div class="motion-fields">
            <ul class="motion-files" aria-label="Asset preview" data-i18n-attrs="aria-label:workbench.assetPreview" hidden></ul>
            <textarea name="idea" aria-label="Creative brief" placeholder="Describe the video you want to create…" data-i18n-attrs="aria-label:motion.ideaLabel;placeholder:motion.ideaPlaceholder" maxlength="3000" rows="2" required></textarea>
            <div class="motion-toolbar">
              <label class="motion-add" title="Add your assets or creative elements — logo, character, background, and more" data-i18n-attrs="title:motion.addAssetsHint">
                <input name="files" type="file" aria-label="Add files" data-i18n-attrs="aria-label:workbench.addFiles" aria-describedby="motion-asset-hint" accept="video/mp4,video/quicktime,video/webm,image/jpeg,image/png,image/webp" multiple />
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14" /></svg>
              </label>
              <input type="hidden" name="ratio" value="16:9" />
              <span id="motion-ratio-label" data-i18n="motion.ratio" hidden>Aspect ratio</span>
              <button class="motion-setting motion-ratio" type="button" popovertarget="motion-ratio-menu" aria-haspopup="menu" aria-labelledby="motion-ratio-label motion-ratio-value">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="12" height="20" x="6" y="2" rx="2" /><rect width="20" height="12" x="2" y="6" rx="2" /></svg>
                <span id="motion-ratio-value">16:9</span>
                <svg class="motion-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
              </button>
              <div id="motion-ratio-menu" popover role="menu" aria-labelledby="motion-ratio-label" dir="ltr">
                <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-ratio="21:9">21:9</button>
                <button type="button" role="menuitemradio" aria-checked="true" tabindex="-1" data-ratio="16:9">16:9</button>
                <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-ratio="4:3">4:3</button>
                <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-ratio="1:1">1:1</button>
                <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-ratio="3:4">3:4</button>
                <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-ratio="9:16">9:16</button>
              </div>
              <label class="motion-setting motion-duration">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 6v6h4.5" /></svg>
                <input id="motion-duration" name="duration" type="range" aria-label="Duration" data-i18n-attrs="aria-label:motion.duration" min="5" max="60" step="1" value="30" />
                <output for="motion-duration">30s</output>
              </label>
              <span class="motion-asset-hint" id="motion-asset-hint" data-invalid="false"></span>
            </div>
          </div>
          <button class="motion-submit" type="submit" aria-describedby="motion-notice motion-asset-hint" disabled>
            <svg class="motion-submit-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
            <svg class="motion-submit-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" /></svg>
            <span class="motion-submit-label" data-i18n="composer.addToCodex">Add to Codex</span>
          </button>
        </div>
        <div class="motion-notice" id="motion-notice" role="status"></div>
        <textarea class="motion-copy-fallback" aria-label="Prompt to copy" data-i18n-attrs="aria-label:motion.copyablePrompt" readonly hidden></textarea>
      </form>
    </dialog>
    <dialog id="project-error-dialog" class="project-error-dialog" aria-labelledby="project-error-title" aria-describedby="project-error-message project-reauthorize-guide">
      <h2 id="project-error-title"></h2>
      <form method="dialog" class="project-error-dismiss">
        <button id="project-error-close" aria-label="Close">
          <svg width="16" height="16" aria-hidden="true"><use href="#close" /></svg>
        </button>
      </form>
      <p id="project-error-message"></p>
      <p id="project-reauthorize-guide" hidden></p>
      <form method="dialog">
        <button id="project-error-confirm" autofocus></button>
      </form>
    </dialog>
    <div role="status" aria-live="polite" aria-atomic="true" popover="manual" class="toast" id="toast"></div>

    <script src="projects.js"></script>
    <script src="theme.js"></script>
    <script src="account-menu.js"></script>
    <script type="module" src="app.mjs"></script>
    <script type="module" src="motion-studio.mjs"></script>
    <script type="module" src="snake.mjs"></script>
  </body>
</html>
