interface:
  display_name: "Topview Canvas"
  short_description: "Operate Canvas projects, SceneCards, generation, layout, and Timeline"
  default_prompt: "Use $operate-topview-canvas to open the authorized Canvas before any creation, keep it visible for direct user participation, place nodes without overlap, create persisted SceneCards, run ordinary or Scene-specific capabilities → submit → refresh generation, and manage Timeline when asked."
dependencies:
  tools:
    - type: "mcp"
      value: "topview"
      description: "Unified Topview MCP server for Canvas operations"
      transport: "streamable_http"
      url: "https://mcp.topview.ai/codex"
policy:
  allow_implicit_invocation: true
